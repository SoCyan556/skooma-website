name: Deploy to Cloudflare Pages

# Builds the site and deploys it to the existing Cloudflare Pages project on every push to main.
# Requires one repository secret: CLOUDFLARE_API_TOKEN (a Cloudflare token with "Cloudflare Pages: Edit"
# on the cyansdepot@gmail.com account). The account id below is not secret.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7f40cdd461a09ed8c4c7b1734c4f3d22
          command: pages deploy dist --project-name=skooma-website --branch=main
